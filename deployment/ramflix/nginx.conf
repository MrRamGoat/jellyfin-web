# Connect this container to the Jellyfin network. API and WebSocket requests
# remain on the existing gateway; this container serves only the web client.
server {
    listen 80;
    server_tokens off;
    resolver 127.0.0.11 valid=30s ipv6=off;
    root /srv/client;

    location = /web/index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Ramflix-Client "source-12.2" always;
    }
    location /web/ {
        try_files $uri @legacy;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Ramflix-Client "source-12.2" always;
    }
    # Already-open legacy clients can still request their original chunks.
    # Backend-generated channel data and avatars also use this fallback.
    location @legacy {
        set $jf jellyfin:8096;
        proxy_pass http://$jf;
        proxy_set_header Host $host;
    }
}
